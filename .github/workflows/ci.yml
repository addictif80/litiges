name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, openssl, zip, curl, dom, libxml, fileinfo
          coverage: none
          tools: composer:v2

      - name: Verifier la syntaxe de tous les fichiers PHP
        run: |
          find app public cron database tests config -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Installer les dependances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests unitaires
        run: vendor/bin/phpunit

  analyse:
    name: Analyse statique (PHPStan)
    runs-on: ubuntu-latest
    # Informatif tant que le niveau n'a pas ete releve : n'empeche pas la fusion.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, openssl, zip, curl, dom, fileinfo
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress
