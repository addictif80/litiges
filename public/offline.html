<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hors ligne — Locavente Litiges</title>
  <meta name="theme-color" content="#0f7bff">
  <style>
    :root { --bleu:#0f7bff; --texte:#1f2937; --texte-doux:#6b7280; --fond:#f5f7fb; }
    * { box-sizing:border-box;margin:0;padding:0 }
    body { font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;background:var(--fond);color:var(--texte);display:grid;place-items:center;min-height:100vh;padding:24px;text-align:center }
    .card { background:#fff;border-radius:16px;box-shadow:0 10px 40px -20px rgba(15,123,255,.4);padding:40px 28px;max-width:420px }
    .icone { font-size:64px;line-height:1;margin-bottom:16px }
    h1 { font-size:22px;margin-bottom:8px }
    p { color:var(--texte-doux);line-height:1.6;margin-bottom:24px }
    .btn { display:inline-flex;align-items:center;gap:8px;background:var(--bleu);color:#fff;text-decoration:none;padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:0 8px 30px -18px var(--bleu) }
    .btn:active { transform:scale(.995) }
  </style>
</head>
<body>
  <main class="card">
    <div class="icone">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>L'application Locavente Litiges n'est pas accessible pour le moment. Vérifiez votre connexion internet et réessayez.</p>
    <a href="./" class="btn">Réessayer</a>
  </main>
</body>
</html>
